name: Extract Restaurant POS Project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q Restaurant-Slip-App.zip -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 3 -type f | head -100

          if [ -f extracted/package.json ]; then
            cp -r extracted/. .
          else
            PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)
            cp -r "$PROJECT_DIR"/. .
          fi

          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Extract Restaurant POS project" || echo "No changes to commit"

          git push
