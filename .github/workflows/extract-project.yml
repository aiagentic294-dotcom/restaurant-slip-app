name: Extract Final Restaurant POS Project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q restaurant-slip-app-final.zip -d extracted

          echo "Final ZIP contents:"
          find extracted -maxdepth 3 -type f | head -100

          if [ -f extracted/package.json ]; then
            cp -r extracted/. .
          else
            PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)
            cp -r "$PROJECT_DIR"/. .
          fi

          rm -rf extracted

      - name: Verify final App.jsx
        run: |
          echo "Checking App.jsx..."
          wc -l src/App.jsx
          grep -q "function usePrinter" src/App.jsx
          grep -q "function PrinterSettingsScreen" src/App.jsx
          grep -q "function PrinterStatus" src/App.jsx
          grep -q "function StatusDot" src/App.jsx
          echo "Printer code verification PASSED"

      - name: Commit final project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Restore final Restaurant POS project" || echo "No changes to commit"

          git push
