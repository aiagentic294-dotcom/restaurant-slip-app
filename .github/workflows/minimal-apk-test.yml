name: Minimal Android Release APK Test

on:
  workflow_dispatch:

jobs:
  build-minimal-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Minimal Android Project
        run: |
          mkdir -p minimal-test/app/src/main/java/com/example/minimaltest
          mkdir -p minimal-test/app/src/main/res/values

          cd minimal-test

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MinimalAndroidTest"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.minimaltest'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.minimaltest"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/release-test.keystore")
                      storePassword "testpassword123"
                      keyAlias "releasekey"
                      keyPassword "testpassword123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Minimal Release Test">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:gravity">center</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/minimaltest/MainActivity.java <<'EOF'
          package com.example.minimaltest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView textView = new TextView(this);
                  textView.setText("Minimal Release Test");
                  textView.setTextSize(24);
                  textView.setTextColor(Color.BLACK);
                  textView.setGravity(Gravity.CENTER);

                  setContentView(textView);
              }
          }
          EOF

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Create Gradle wrapper
        working-directory: minimal-test
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Generate release signing key
        working-directory: minimal-test
        run: |
          keytool -genkeypair \
            -keystore release-test.keystore \
            -storepass testpassword123 \
            -keypass testpassword123 \
            -alias releasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Minimal Release Test, O=Test, C=US"

      - name: Build release APK
        working-directory: minimal-test
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Check release APK
        working-directory: minimal-test
        run: |
          echo "========== RELEASE APK =========="
          ls -lh app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/release/app-release.apk

      - name: Inspect release APK signing certificate
        working-directory: minimal-test
        run: |
          echo "========== RELEASE APK SIGNING CERTIFICATE =========="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo ""
          echo "Certificate information:"

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-release-test-apk
          path: minimal-test/app/build/outputs/apk/release/app-release.apk
