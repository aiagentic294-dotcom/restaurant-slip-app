name: Minimal Android APK Test

on:
  workflow_dispatch:

jobs:
  build-minimal-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Minimal Android Project
        run: |
          mkdir -p minimal-test/app/src/main/java/com/example/minimaltest
          mkdir -p minimal-test/app/src/main/res/values

          cd minimal-test

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MinimalAndroidTest"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.minimaltest'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.minimaltest"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Minimal Android Test">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:gravity">center</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/minimaltest/MainActivity.java <<'EOF'
          package com.example.minimaltest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView textView = new TextView(this);

                  textView.setText("Minimal Android Test");
                  textView.setTextSize(24);
                  textView.setTextColor(Color.BLACK);
                  textView.setGravity(Gravity.CENTER);

                  setContentView(textView);
              }
          }
          EOF

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        working-directory: minimal-test
        run: |
          gradle --version

      - name: Build Minimal APK
        working-directory: minimal-test
        run: |
          gradle assembleDebug --no-daemon

      - name: Check APK
        working-directory: minimal-test
        run: |
          echo "========== APK FILE =========="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect Minimal APK Signing Certificate
        working-directory: minimal-test
        run: |
          echo "========== MINIMAL APK SIGNING CERTIFICATE =========="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo ""
          echo "Certificate information:"

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Minimal APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-test-apk
          path: minimal-test/app/build/outputs/apk/debug/app-debug.apk
