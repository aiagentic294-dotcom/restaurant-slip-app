name: Deep APK Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.restaurant.slipapp",
            "appName": "Restaurant POS",
            "webDir": "dist"
          }
          EOF

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Deep APK inspection
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========== APK =========="
          ls -lh "$APK"
          file "$APK"

          echo ""
          echo "========== APK ZIP TEST =========="
          unzip -t "$APK" | tail -5

          echo ""
          echo "========== APK CONTENT =========="
          unzip -l "$APK" | head -80

          echo ""
          echo "========== ANDROID SDK =========="
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -3

          echo ""
          echo "========== BADGING =========="
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK"

          echo ""
          echo "========== SIGNATURE =========="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Check APK contents
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking required Android files..."

          unzip -l "$APK" | grep "AndroidManifest.xml"
          unzip -l "$APK" | grep "classes.dex"
          unzip -l "$APK" | grep "resources.arsc"

          echo ""
          echo "APK structural checks completed successfully."

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: deep-check-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
